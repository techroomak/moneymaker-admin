<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet"
href="./css/style.css">

</head>

<body>

<div class="admin-layout">

<!-- SIDEBAR -->

<div class="sidebar">

<h2 class="logo">
MoneyMaker Admin
</h2>

<button class="menu-btn active-btn">
Dashboard
</button>

<button class="menu-btn">
Users
</button>

<button class="menu-btn">
Withdraw
</button>

<button class="menu-btn">
Tasks
</button>

<button class="menu-btn">
Notifications
</button>

<button class="menu-btn">
Settings
</button>

</div>

<!-- MAIN -->

<div class="main-panel">

<h1 class="page-title">
Dashboard
</h1>

<!-- DASHBOARD TABLE -->

<div class="dashboard-table">

<div class="dashboard-head">
Total Users
</div>

<div class="dashboard-head">
Total Coin
</div>

<div class="dashboard-head">
Total Withdraw
</div>

<div class="dashboard-head">
Pending Withdraw
</div>

<div class="dashboard-head">
Total Earn
</div>

<div class="dashboard-head">
Total Refer
</div>

<div class="dashboard-head">
Active Users
</div>

<!-- VALUES -->

<div
id="totalUsers"
class="dashboard-value">
0
</div>

<div
id="totalCoin"
class="dashboard-value">
0
</div>

<div
id="totalWithdraw"
class="dashboard-value">
0
</div>

<div
id="pendingWithdraw"
class="dashboard-value">
0
</div>

<div
id="totalEarn"
class="dashboard-value">
0
</div>

<div
id="totalRefer"
class="dashboard-value">
0
</div>

<div
id="activeUsers"
class="dashboard-value">
0
</div>

</div>

<!-- USER SECTION -->

<div class="table-box">

<div class="table-top">

<h2>
Users
</h2>

<input
id="searchInput"
class="search-input"
type="text"
placeholder="Search UID..."
oninput="searchUser()"
>

</div>

<div id="userList">

Loading...

</div>

</div>

</div>

</div>

<script type="module"
src="./js/admin.js"></script>

</body>
</html>
