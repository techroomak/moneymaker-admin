<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet"
href="./css/style.css">

</head>

<body>

<div class="admin-layout">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="sidebar-top">

<h2 class="logo">
MoneyMaker
</h2>

<p class="admin-text">
Admin Panel
</p>

</div>

<div class="menu-list">

<button
class="menu-btn active-btn"
onclick="showSection('dashboardSection')"
>
Dashboard
</button>

<button
class="menu-btn"
onclick="showSection('usersSection')"
>
Users
</button>

<button
id="withdrawSection"
class="menu-btn"
onclick="showSection('withdrawSection')"
>
Withdraw
</button>

<button
class="menu-btn"
onclick="showSection('taskSection')"
>
Tasks
</button>

<button
class="menu-btn"
onclick="showSection('notificationSection')"
>
Notifications
</button>

<button
class="menu-btn"
onclick="showSection('settingsSection')"
>
Settings
</button>

</div>

</div>

<!-- MAIN -->

<div class="main-panel">

<!-- DASHBOARD -->

<section
id="dashboardSection"
class="content-section active-section"
>

<h1 class="page-title">
Dashboard Overview
</h1>

<div class="stats-grid">

<div class="stats-card">

<h3>
Total Users
</h3>

<p id="totalUsers">
0
</p>

</div>

<div class="stats-card">

<h3>
Active Users
</h3>

<p id="activeUsers">
0
</p>

</div>

<div class="stats-card">

<h3>
Inactive Users
</h3>

<p id="inactiveUsers">
0
</p>

</div>

<div class="stats-card">

<h3>
Total Coin
</h3>

<p id="totalCoin">
0
</p>

</div>

<div class="stats-card">

<h3>
Pending Withdraw
</h3>

<p id="pendingWithdraw">
0
</p>

</div>

<div class="stats-card">

<h3>
Total Withdraw
</h3>

<p id="totalWithdraw">
0
</p>

</div>

</div>

</section>

<!-- USERS -->

<section
id="usersSection"
class="content-section"
>

<div class="section-top">

<h1 class="page-title">
Users
</h1>

<input
id="searchInput"
class="search-input"
type="text"
placeholder="Search UID..."
oninput="searchUser()"
>

</div>

<div class="table-box">

<div id="userList">

Loading...

</div>

</div>

</section>

<div class="stats-card">

<h3>
Online Users
</h3>

<p id="onlineUsers">
0
</p>

</div>

<!-- WITHDRAW -->

<section
id="withdrawSection"
class="content-section"
>

<div class="section-top">

<h1 class="page-title">
Withdraw Requests
</h1>

</div>

<div class="table-box">

<div id="withdrawList">

Loading...

</div>

</div>

</section>

<!-- TASK -->

<section
id="taskSection"
class="content-section"
>

<h1 class="page-title">
Tasks
</h1>

<div class="table-box">

Coming Soon

</div>

</section>

<!-- NOTIFICATION -->

<section
id="notificationSection"
class="content-section"
>

<h1 class="page-title">
Notifications
</h1>

<div class="table-box">

Coming Soon

</div>

</section>

<!-- SETTINGS -->

<section
id="settingsSection"
class="content-section"
>

<h1 class="page-title">
Settings
</h1>

<div class="table-box">

Coming Soon

</div>

</section>

</div>

</div>

<div
id="imagePreview"
class="image-preview"
onclick="closePreview()"
>

<img
id="previewImg"
class="preview-img"
src=""
>

</div>

<script type="module"
src="./js/admin.js"></script>

</body>
</html>
