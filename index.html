<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login Ak</title>

<link rel="stylesheet"
href="./css/style.css">

</head>

<body>

<div class="login-container">

<div class="login-card">

<h1 class="login-title">
Admin Login
</h1>

<input
id="email"
class="login-input"
type="email"
placeholder="Enter Email"
>

<input
id="password"
class="login-input"
type="password"
placeholder="Enter Password"
>

<button
class="login-button"
onclick="loginAdmin()"
>
Login
</button>

<p
id="loginStatus"
class="login-status"
>
</p>

</div>

</div>

<script type="module"
src="./js/auth.js"></script>

</body>
</html>
